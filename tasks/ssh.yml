---
- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: latest
  when: not ssh_bootstrap
  notify:
    - Restarts sshd

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: auto
  when: not ssh_bootstrap

# PerSourceMaxStartups needs OpenSSH >= 8.5; the template leaves it out when
# this fact is missing or older. Debian versions look like "1:9.2p1-2+deb12u3".
- name: Determine installed OpenSSH version
  ansible.builtin.set_fact:
    __ssh_openssh_version: "{{ ansible_facts.packages['openssh-server'][0].version
                               | regex_replace('^[0-9]+:', '')
                               | regex_search('^[0-9]+\\.[0-9]+') }}"
  when:
    - not ssh_bootstrap
    - "'openssh-server' in ansible_facts.packages"

- name: Deploys sshd config
  ansible.builtin.template:
    src: "sshd_config.j2"
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  when: not ssh_bootstrap
  notify:
    - Restarts sshd

- name: Deploys authorized ssh keys for users
  ansible.posix.authorized_key:
    user: "{{ item.user | default('root') }}"
    key: "{{ item.key }}"
    path: "{{ item.keyfile | default(omit) }}"
    state: present
  loop: "{{ ssh_keys }}"
  tags: ["ssh:keys"]

- name: Adds ferm filtering
  ansible.builtin.template:
    src: "ferm.j2"
    dest: /etc/ferm/filter-input.d/60_ssh.conf
    mode: "0644"
  when: ferm_enabled
  tags: ["ferm"]
  notify: Restart ferm

- name: Creates sftp group if needed
  ansible.builtin.group:
    name: "{{ ssh_sftp_chroot.group }}"
    gid: "{{ ssh_sftp_chroot.gid | default(omit) }}"
  when: ssh_sftp_chroot is defined and 'group' in ssh_sftp_chroot

- name: Creates rsyslog configuration if needed
  ansible.builtin.group:
    name: "{{ ssh_sftp_chroot.group }}"
    gid: "{{ ssh_sftp_chroot.gid | default(omit) }}"
  when: ssh_sftp_chroot is defined and 'rsyslog_file' in ssh_sftp_chroot
